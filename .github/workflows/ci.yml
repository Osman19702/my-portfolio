name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Playwright e2e + accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run test suite
        run: npm test

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  visual:
    name: Visual check against master (Elastishot)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          # The base is the first parent of the merge commit the checkout
          # makes. It is captured in this same job, so fonts and Chromium
          # match the pull request's side exactly.
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs `elastishot pr` with the elastishot in package-lock.json and
      # installs its Chromium. It writes the table of changed elements to the
      # job summary and uploads the report as the elastishot-report artifact.
      # A visual change is a notice; the job only fails if the check cannot run.
      - name: Compare the pull request with the target branch
        uses: Osman19702/elastishot-action@v0.3

